<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sudoku</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Sudoku</h1>
      <div class="controls">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
        <button id="new-game">New Game</button>
        <button id="reset">Reset</button>
        <button id="check">Check</button>
      </div>
      <div class="status">
        <span id="timer">00:00</span>
        <span id="message" role="status" aria-live="polite"></span>
      </div>
    </header>

    <main>
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
    </main>

    <footer>
      <p>Fill every row, column and 3&times;3 box with the digits 1-9. Use the keyboard (1-9, Backspace/Delete) or click a cell.</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
